networks:
  web:
    external: true
  internal:
    external: false

services:
   photo_madsnorgaard_db:
     image: mysql:8.0
     volumes:
       - ./wordpress.sql:/docker-entrypoint-initdb.d/init.sql # prepopulate database
       - db_data:/var/lib/mysql # persist database data inside docker storage
     restart: always
     env_file:
      - .env
     environment:
      DOCKER_COMPOSE_YML_LOCATION: ${PWD}
     container_name: ${WORDPRESS_DOMAIN}_db
     networks:
      - internal
     labels:
      - traefik.enable=false


   photo_madsnorgaard_wordpress:
     depends_on:
       - photo_madsnorgaard_db
     # Pinned exact tag (Dependabot bumps it). Core still self-applies minor
     # security updates inside the wp_html volume; the image never downgrades.
     image: wordpress:7.0.2-php8.4-apache
     restart: always
     environment:
       WORDPRESS_DB_HOST: photo_madsnorgaard_db:3306
       WORDPRESS_DB_USER: ${MYSQL_USER}
       WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
       WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
       DOCKER_COMPOSE_YML_LOCATION: ${PWD}
       # Shared secret for the Nuxt BFF (X-Internal-Token): rate-limit bypass
       # + event-archive write auth. Read via getenv() by photo-api-security.
       PHOTO_API_INTERNAL_TOKEN: ${PHOTO_API_INTERNAL_TOKEN:-}
       # Hardening: no wp-admin file editors or plugin installs (code is
       # composer/image-managed; note this also disables Wordfence
       # self-update — composer owns that). The X-Forwarded-Proto shim
       # prevents a FORCE_SSL_ADMIN redirect loop behind Traefik.
       WORDPRESS_CONFIG_EXTRA: |
         if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
         define('DISALLOW_FILE_EDIT', true);
         define('DISALLOW_FILE_MODS', true);
         define('FORCE_SSL_ADMIN', true);
     volumes:
       - wp_html:/var/www/html
       - ./wp-content:/var/www/html/wp-content
       - ./php-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
     container_name: ${WORDPRESS_DOMAIN}_wordpress
     labels:
       - traefik.http.routers.photo_madsnorgaard_wordpress.rule=Host(`${WORDPRESS_DOMAIN}`) || Host(`www.${WORDPRESS_DOMAIN}`)
       - traefik.http.routers.photo_madsnorgaard_wordpress.tls=true
       - traefik.http.routers.photo_madsnorgaard_wordpress.tls.certresolver=lets-encrypt
       # Per-service CSP — WordPress needs unsafe-inline/unsafe-eval for Gutenberg admin.
       # blob: is required since WP 7: the block editor renders its canvas in a
       # blob:-URL iframe (frame-src), media upload processing runs in a blob:
       # Worker (worker-src), and media-library previews are blob: object URLs
       # (img-src/media-src). Without it wp-admin shows a blank grey editor canvas.
       - "traefik.http.middlewares.photo-csp.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://analytics.theazanianprepper.online; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://analytics.theazanianprepper.online; media-src 'self' blob: https:; frame-src 'self' blob: https:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; upgrade-insecure-requests"
       - "traefik.http.routers.photo_madsnorgaard_wordpress.middlewares=photo-csp"
       # Admin surface behind proxy-level basic auth: bots and exploit probes
       # never reach a line of PHP. Replaces Wordfence's login heuristics.
       # WP_ADMIN_BASIC_AUTH = htpasswd entry in .env (generate:
       # `htpasswd -nbB admin 'passphrase'`). MUST be set before deploying.
       - "traefik.http.routers.photo_wp_admin.rule=(Host(`${WORDPRESS_DOMAIN}`) || Host(`www.${WORDPRESS_DOMAIN}`)) && (PathPrefix(`/wp-admin`) || PathPrefix(`/member`) || Path(`/wp-login.php`))"
       - "traefik.http.routers.photo_wp_admin.priority=100"
       - "traefik.http.routers.photo_wp_admin.tls=true"
       - "traefik.http.routers.photo_wp_admin.tls.certresolver=lets-encrypt"
       - "traefik.http.middlewares.photo-admin-auth.basicauth.users=${WP_ADMIN_BASIC_AUTH}"
       - "traefik.http.routers.photo_wp_admin.middlewares=photo-admin-auth,photo-csp"
     networks:
       - internal
       - web

   cli:
     image: wordpress:cli-2.12.0-php8.4
     user: "33:33"
     container_name: ${WORDPRESS_DOMAIN}_cli
     env_file: .env
     environment:
       WORDPRESS_DB_HOST: photo_madsnorgaard_db:3306
       WORDPRESS_DB_USER: "${MYSQL_USER}"
       WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD}"
       WORDPRESS_DB_NAME: "${MYSQL_DATABASE}"
     volumes:
       - wp_html:/var/www/html
       - ./wp-content:/var/www/html/wp-content
     networks:
       - internal
     depends_on:
       - photo_madsnorgaard_db
     profiles:
       - cli

volumes:
    db_data: {}
    wp_html: {}
