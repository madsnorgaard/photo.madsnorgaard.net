version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # WP plugins via wpackagist. Majors are NOT ignored: WordPress plugin
  # "majors" (Wordfence 8→9 etc.) routinely carry security fixes, and the
  # API-contract harness (scripts/api-snapshot.sh) makes merging cheap.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # Pinned wordpress image tags in docker-compose.yml (core + cli).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
